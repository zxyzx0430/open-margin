# Windows API-only ingress. Tailscale Serve terminates HTTPS and proxies to
# localhost:18768; this container is the only reachable private HTTP target.
# Default deny: no Wallos login, OAuth, MCP, administrative or debug endpoints.
server {
    listen 80 default_server;
    server_name _;
    server_tokens off;
    merge_slashes on;
    client_max_body_size 4m;
    # Reject encoded or ambiguous URI paths before nginx normalizes them.
    if ($request_uri ~ "%") { return 404; }

    location = /finance/health {
        if ($request_method != GET) { return 405; }
        proxy_pass http://finance-api:8767/health;
    }

    location = /finance/api/v2/sync/changes {
        if ($request_method != GET) { return 405; }
        proxy_set_header X-Device-Token $http_x_device_token;
        proxy_set_header X-Forwarded-Proto https;
        proxy_pass http://finance-api:8767/api/v2/sync/changes;
    }

    location = /finance/api/v2/sync/push {
        if ($request_method != POST) { return 405; }
        proxy_set_header X-Device-Token $http_x_device_token;
        proxy_set_header X-Forwarded-Proto https;
        proxy_pass http://finance-api:8767/api/v2/sync/push;
    }

    # Legacy uploads are still used by TransactionSyncWorker for earlier
    # unsynced records and proven one-cent repair before v2 replication.
    location = /finance/api/v1/transactions/batch {
        if ($request_method != POST) { return 405; }
        proxy_set_header X-Device-Token $http_x_device_token;
        proxy_set_header X-Forwarded-Proto https;
        proxy_pass http://finance-api:8767/api/v1/transactions/batch;
    }

    location = /finance/api/v1/transactions/correct-rounding {
        if ($request_method != POST) { return 405; }
        proxy_set_header X-Device-Token $http_x_device_token;
        proxy_set_header X-Forwarded-Proto https;
        proxy_pass http://finance-api:8767/api/v1/transactions/correct-rounding;
    }

    location / {
        return 404;
    }
}
