# Open Margin public Tailscale Funnel ingress.
# Tailscale Funnel terminates HTTPS for https://<host>.ts.net/finance and
# proxies to 127.0.0.1:<GATEWAY_PORT>; this container is the only reachable
# HTTP target. Allowlist only: health and the four device-sync endpoints.
# Everything else is 404, wrong methods are 405, encoded paths are rejected,
# requests are rate/connection limited, and access logs never contain headers.

limit_req_zone $binary_remote_addr zone=om_public_sync_req:10m rate=10r/s;
limit_conn_zone $binary_remote_addr zone=om_public_sync_conn:10m;

# $uri is the normalized path without the query string; request headers are
# never part of this format, so X-Device-Token cannot leak into access logs.
log_format om_public_sync '$remote_addr - [$time_local] "$request_method $uri" $status $body_bytes_sent';
access_log /var/log/nginx/access.log om_public_sync;

server {
    listen 80 default_server;
    server_name _;
    server_tokens off;
    merge_slashes on;
    client_max_body_size 4m;

    limit_req zone=om_public_sync_req burst=20 nodelay;
    limit_conn om_public_sync_conn 10;
    limit_req_status 429;
    limit_conn_status 429;

    # Reject encoded or ambiguous URI paths before nginx normalizes them.
    if ($request_uri ~ "%") { return 404; }

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Device-Token $http_x_device_token;
    proxy_connect_timeout 10s;
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;

    location = /finance/health {
        if ($request_method != GET) { return 405; }
        proxy_pass http://finance-api:8767/health;
    }

    location = /finance/api/v2/sync/changes {
        if ($request_method != GET) { return 405; }
        proxy_pass http://finance-api:8767/api/v2/sync/changes;
    }

    location = /finance/api/v2/sync/push {
        if ($request_method != POST) { return 405; }
        proxy_pass http://finance-api:8767/api/v2/sync/push;
    }

    # Legacy device uploads used by older Android builds and the one-cent
    # rounding repair. They remain API-only and require the device token.
    location = /finance/api/v1/transactions/batch {
        if ($request_method != POST) { return 405; }
        proxy_pass http://finance-api:8767/api/v1/transactions/batch;
    }

    location = /finance/api/v1/transactions/correct-rounding {
        if ($request_method != POST) { return 405; }
        proxy_pass http://finance-api:8767/api/v1/transactions/correct-rounding;
    }

    location / {
        return 404;
    }
}
