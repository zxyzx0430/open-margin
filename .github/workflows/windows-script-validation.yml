name: Windows Install Script Syntax

on:
  push:
    paths:
      - 'deploy/windows/**'
      - '.github/workflows/windows-script-validation.yml'
      - '.github/workflows/windows-setup-installer.yml'
      - '.github/workflows/windows-setup-tests.yml'
  pull_request:
    paths:
      - 'deploy/windows/**'
      - '.github/workflows/windows-script-validation.yml'
      - '.github/workflows/windows-setup-installer.yml'
      - '.github/workflows/windows-setup-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  powershell-parse:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Parse all Windows deployment PowerShell files
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $files = @(Get-ChildItem -Path 'deploy/windows' -Recurse -File -Include '*.ps1', '*.psm1', '*.psd1')
          if ($files.Count -eq 0) {
            throw 'No PowerShell files found under deploy/windows'
          }
          $nonBomNonAscii = New-Object System.Collections.Generic.List[string]
          foreach ($file in $files) {
            $tokens = $null
            $errors = $null
            $null = [System.Management.Automation.Language.Parser]::ParseFile(
              $file.FullName, [ref]$tokens, [ref]$errors
            )
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error "$($file.FullName) : $($_.Message)" }
              throw "PowerShell parse failed: $($file.FullName)"
            }

            $bytes = [IO.File]::ReadAllBytes($file.FullName)
            $hasBom = ($bytes.Length -ge 3 -and $bytes[0] -eq 0xEF -and $bytes[1] -eq 0xBB -and $bytes[2] -eq 0xBF)
            $text = [IO.File]::ReadAllText($file.FullName)
            if (-not $hasBom -and ($text -match '[^\x00-\x7F]')) {
              $nonBomNonAscii.Add($file.FullName)
              Write-Warning "Non-ASCII script without UTF-8 BOM (Windows PowerShell 5.1 may misread it): $($file.FullName)"
            }
            Write-Host "PASS: $($file.FullName)"
          }
          if ($nonBomNonAscii.Count -gt 0) {
            Write-Warning "$($nonBomNonAscii.Count) non-ASCII script(s) lack a UTF-8 BOM; see warnings above."
          }
          Write-Host 'Windows PowerShell script syntax checks passed'

      - name: Scan merge conflict markers in Windows deployment files
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $files = @(Get-ChildItem -Path 'deploy/windows' -Recurse -File |
            Where-Object { $_.Extension -in '.ps1', '.psm1', '.psd1', '.iss', '.cmd', '.md', '.txt' })
          $files += @(Get-ChildItem -Path '.github/workflows' -File -Filter 'windows-*.yml')
          foreach ($file in $files) {
            $hits = @(Select-String -Path $file.FullName -Pattern '^(<<<<<<<|>>>>>>>)( |$)|^=======$')
            if ($hits.Count -gt 0) {
              $hits | ForEach-Object { Write-Error "$($file.FullName):$($_.LineNumber): $($_.Line)" }
              throw "Unresolved merge markers found: $($file.FullName)"
            }
          }
          Write-Host "Merge-marker scan passed for $($files.Count) files"
