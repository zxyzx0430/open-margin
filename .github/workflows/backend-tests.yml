name: Test Finance Backend
on:
  workflow_dispatch:
  push:
    paths:
      - 'backend/**'
      - 'deploy/**'
      - '.github/workflows/backend-tests.yml'
jobs:
  unittest:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: |
          python -m pip install -r backend/requirements.txt 'httpx>=0.27,<1'
      - name: Run tests
        working-directory: backend
        run: python -m unittest discover -p 'test_*.py' -v
