name: Build Android APK
on:
  workflow_dispatch:
  push:
    paths:
      - 'android/**'
      - '.github/workflows/android-build.yml'
jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Android SDK
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)
          test -n "$SDKMANAGER"
          "$SDKMANAGER" --install 'platforms;android-35' 'build-tools;35.0.0'
      # 模型（71MB）与 sherpa-onnx 原生库（36MB）不进 git；缓存键绑定模型名 +
      # 两个文件的 sha256，换模型/换版本会自动 miss，不会拿旧模型骗过校验。
      - name: Restore on-device ASR model cache
        uses: actions/cache@v4
        with:
          path: |
            android/app/src/main/assets/asr
            android/app/libs
            ~/.cache/open-margin-asr
          key: asr-zipformer-medium-ctc-chunk16-7cb84949b8d4f40d72df137e2e3529a1aadfc897e5257460f720bb73c99f10f1-e2f16836a4c712a9a01a1656f4610f66093fe283159883ee66b73ebb6e80364b
          restore-keys: |
            asr-zipformer-medium-ctc-chunk16-
      - name: Prepare on-device ASR model
        working-directory: android
        run: |
          chmod +x app/download-asr-model.sh
          bash app/download-asr-model.sh
          # 再跑一次 --check：确认落到磁盘的资产与脚本里的 sha256 完全一致。
          bash app/download-asr-model.sh --check
      - name: Runner resource diagnostics
        run: |
          df -h
          free -h
          java -version
      - name: Run Android unit tests and build Debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          # GitHub 实验版显式开启主动截图监听；默认 false，Play 构建不传该参数。
          ./gradlew --no-daemon --max-workers=2 --stacktrace -Dorg.gradle.jvmargs="-Xmx4g -Dfile.encoding=UTF-8" -PopenMarginScreenshotWatcher=true testDebugUnitTest assembleDebug
      - name: Build unsigned Release APK
        working-directory: android
        run: |
          # Keep the test and release packaging workloads in separate JVMs.
          df -h
          free -h
          ./gradlew --no-daemon --max-workers=2 --stacktrace -Dorg.gradle.jvmargs="-Xmx4g -Dfile.encoding=UTF-8" -PopenMarginScreenshotWatcher=true assembleRelease
          test -s app/build/outputs/apk/release/app-release-unsigned.apk
          unzip -tq app/build/outputs/apk/release/app-release-unsigned.apk
      - name: Runner resources after build failure
        if: failure()
        run: |
          df -h
          free -h
          du -sh android/app/build android/paddle-ocr-sdk/build ~/.gradle/caches 2>/dev/null || true
      - name: Upload Android unit test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-unit-test-reports
          path: |
            android/app/build/test-results/testDebugUnitTest/
            android/app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: ignore
          retention-days: 7
      - name: Verify ASR payload inside the APK
        working-directory: android
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/release/app-release-unsigned.apk
          LIST=$(unzip -l "$APK")
          grep -q 'assets/asr/zipformer-medium-ctc/ctc-chunk-16-left-64.int8.onnx' <<< "$LIST"
          grep -q 'assets/asr/zipformer-medium-ctc/tokens.txt' <<< "$LIST"
          grep -q 'lib/arm64-v8a/libsherpa-onnx-jni.so' <<< "$LIST"
          # 只能有一个 ONNX Runtime（paddle-ocr 的 1.21.1）。sherpa 静态链接 ORT，
          # 若这里出现第二份 libonnxruntime.so，说明 AAR 被换回了普通版本。
          COUNT=$(grep -c 'lib/arm64-v8a/libonnxruntime.so' <<< "$LIST" || true)
          test "$COUNT" -eq 1
          ls -l "$APK"
          echo "APK_MB=$(( $(stat -c%s "$APK") / 1024 / 1024 ))"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: finance-collector-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          # The permanent private key never leaves the VPS; release APKs
          # are aligned and signed only on that machine.
          name: finance-collector-unsigned-release
          path: android/app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
          retention-days: 7

      # This opt-in gate is limited to the V4 test branch until the device
      # regression suite accepts R8. Regular release signing stays unchanged.
      - name: Build V4 R8 performance preview
        if: github.ref_name == 'feat/frontend-v4'
        working-directory: android
        run: |
          ./gradlew --no-daemon --max-workers=2 --stacktrace -Dorg.gradle.jvmargs="-Xmx4g -Dfile.encoding=UTF-8" -PopenMarginPerformancePreview=true -PopenMarginScreenshotWatcher=true :app:assembleDebug
          test -s app/build/outputs/apk/debug/app-debug.apk
          test -s app/build/outputs/mapping/debug/mapping.txt
          unzip -tq app/build/outputs/apk/debug/app-debug.apk
          cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/open-margin-v4-performance.apk
          unzip -l app/build/outputs/apk/debug/open-margin-v4-performance.apk | grep 'libsherpa-onnx-jni.so'
      - name: Upload V4 R8 performance preview
        if: github.ref_name == 'feat/frontend-v4'
        uses: actions/upload-artifact@v4
        with:
          name: finance-collector-v4-performance
          path: android/app/build/outputs/apk/debug/open-margin-v4-performance.apk
          if-no-files-found: error
          retention-days: 14
      - name: Compile V4 benchmark module
        if: github.ref_name == 'feat/frontend-v4'
        working-directory: android
        run: |
          ./gradlew --no-daemon --max-workers=2 --stacktrace -Dorg.gradle.jvmargs="-Xmx4g -Dfile.encoding=UTF-8" -PopenMarginPerformancePreview=true -PopenMarginBenchmarks=true -PopenMarginScreenshotWatcher=true :benchmark:assembleDebug
