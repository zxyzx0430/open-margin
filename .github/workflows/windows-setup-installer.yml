name: Windows Setup Installer

on:
  push:
    tags:
      - 'v*'
  pull_request:
    paths:
      - 'deploy/windows/setup/**'
      - '.github/workflows/windows-setup-installer.yml'
  workflow_dispatch:
    inputs:
      build_offline_bundle:
        description: 'Also build the offline Docker image bundle (slow)'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  installer:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: version
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            $version = $env:GITHUB_REF_NAME.TrimStart('v')
          } else {
            $version = '1.3.0'
          }
          "value=$version" >> $env:GITHUB_OUTPUT

      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          if ($LASTEXITCODE -ne 0) { throw 'choco install innosetup failed' }

      - name: Build installer
        shell: pwsh
        run: |
          $out = Join-Path $env:RUNNER_TEMP 'openmargin-installer'
          ./deploy/windows/setup/installer/Build-Installer.ps1 -Version '${{ steps.version.outputs.value }}' -OutputDir $out -NoAutoInstall
          if ($LASTEXITCODE -ne 0) { throw 'installer build failed' }
          Get-ChildItem $out | Format-Table Name, Length

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-setup-installer-${{ github.run_number }}
          path: |
            ${{ runner.temp }}/openmargin-installer/OpenMargin-Setup.exe
            ${{ runner.temp }}/openmargin-installer/OpenMargin-Setup.exe.sha256
          if-no-files-found: error

      - name: Attach installer to tag release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          $installer = Join-Path $env:RUNNER_TEMP 'openmargin-installer/OpenMargin-Setup.exe'
          $sha = "$installer.sha256"
          gh release view $tag 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --draft --title $tag --notes "Windows setup assets for $tag"
            if ($LASTEXITCODE -ne 0) { throw 'gh release create failed' }
          }
          gh release upload $tag $installer $sha --clobber
          if ($LASTEXITCODE -ne 0) { throw 'gh release upload failed' }

  offline-bundle:
    if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.build_offline_bundle)
    needs: installer
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: version
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            $version = $env:GITHUB_REF_NAME.TrimStart('v')
          } else {
            $version = '1.3.0'
          }
          "value=$version" >> $env:GITHUB_OUTPUT

      - name: Validate offline image plan (dry run)
        shell: pwsh
        run: |
          ./deploy/windows/setup/Build-OfflineBundle.ps1 -DryRun -Version '${{ steps.version.outputs.value }}'

      - name: Build offline Docker image bundle
        shell: pwsh
        run: |
          $out = Join-Path $env:RUNNER_TEMP 'openmargin-offline'
          ./deploy/windows/setup/Build-OfflineBundle.ps1 -Version '${{ steps.version.outputs.value }}' -OutputDir $out -Force
          Get-ChildItem $out | Format-Table Name, Length

      - name: Upload offline bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-offline-bundle-${{ github.run_number }}
          path: |
            ${{ runner.temp }}/openmargin-offline/OpenMargin-Offline-*.tar.gz
            ${{ runner.temp }}/openmargin-offline/OpenMargin-Offline-*.tar.gz.sha256
            ${{ runner.temp }}/openmargin-offline/OpenMargin-Offline-*.manifest.json
          if-no-files-found: error

      - name: Attach offline bundle to tag release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          $out = Join-Path $env:RUNNER_TEMP 'openmargin-offline'
          gh release view $tag 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --draft --title $tag --notes "Windows setup assets for $tag"
            if ($LASTEXITCODE -ne 0) { throw 'gh release create failed' }
          }
          $assets = @(Get-ChildItem -Path $out -File -Filter 'OpenMargin-Offline-*' | ForEach-Object { $_.FullName })
          if ($assets.Count -eq 0) { throw 'no offline bundle assets found' }
          gh release upload $tag $assets --clobber
          if ($LASTEXITCODE -ne 0) { throw 'offline bundle upload failed' }
