name: Windows Setup Engine Tests

on:
  push:
    paths:
      - 'deploy/windows/setup/**'
      - '.github/workflows/windows-setup-tests.yml'
  pull_request:
    paths:
      - 'deploy/windows/setup/**'
      - '.github/workflows/windows-setup-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pester:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Ensure Pester 5
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $pester = Get-Module -ListAvailable Pester | Sort-Object Version -Descending | Select-Object -First 1
          if (-not $pester -or $pester.Version.Major -lt 5) {
            Install-Module Pester -MinimumVersion 5.0 -Force -SkipPublisherCheck -Scope CurrentUser
          }
          Import-Module Pester -MinimumVersion 5.0
          Write-Host ('Pester ' + (Get-Module Pester).Version)

      - name: Run Pester tests
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $testPath = 'deploy/windows/setup/tests'
          if (-not (Test-Path $testPath)) {
            Write-Host 'No deploy/windows/setup/tests directory yet; skipping Pester run.'
            exit 0
          }
          $files = @(Get-ChildItem -Path $testPath -Recurse -File -Filter '*.Tests.ps1')
          if ($files.Count -eq 0) {
            Write-Host 'The tests directory exists but contains no *.Tests.ps1 files; skipping Pester run.'
            exit 0
          }
          Import-Module Pester -MinimumVersion 5.0
          $result = Invoke-Pester -Path $testPath -Output Detailed -PassThru
          Write-Host ('Pester: passed=' + $result.PassedCount + ' failed=' + $result.FailedCount + ' skipped=' + $result.SkippedCount)
          if ($result.FailedCount -gt 0) {
            throw ('Pester failures: ' + $result.FailedCount)
          }

  offline-bundle-plan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Validate offline bundle image classification
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          function Assert-Plan([object[]]$Lines, [string]$Label) {
            $built = ($Lines | Where-Object { $_ -like 'built=*' } | Select-Object -First 1)
            $base = ($Lines | Where-Object { $_ -like 'base=*' } | Select-Object -First 1)
            if (-not $built -or -not $base) { throw "$Label : dry run did not print built= and base= lines" }
            foreach ($required in @('finance-api', 'wallos')) {
              if ($built -notmatch [regex]::Escape($required)) { throw "$Label : built image plan is missing $required" }
            }
            foreach ($required in @('nginx:1.28-alpine', 'python:3.11-slim', 'bellamy/wallos')) {
              if ($base -notmatch [regex]::Escape($required)) { throw "$Label : base image plan is missing $required" }
            }
            if ($base -match 'finance-api|personal-finance-system-wallos') {
              throw "$Label : built images must not be classified as base images"
            }
            if (Test-Path 'secrets/backend.env') { throw "$Label : placeholder secrets were not cleaned up" }
            if (Test-Path 'secrets/wallos-ledger.env') { throw "$Label : placeholder ledger env was not cleaned up" }
            if (Test-Path '.env') { throw "$Label : placeholder .env was not cleaned up" }
          }

          # Reproduce a clean runner: compose must succeed without checked-out
          # secrets/.env because the script creates temporary placeholders.
          Remove-Item -Force 'secrets/backend.env' -ErrorAction SilentlyContinue
          Remove-Item -Force 'secrets/wallos-ledger.env' -ErrorAction SilentlyContinue
          Remove-Item -Force '.env' -ErrorAction SilentlyContinue

          Write-Host '--- compose JSON path ---'
          $jsonLines = @(& ./deploy/windows/setup/Build-OfflineBundle.ps1 -DryRun -Version 0.0.0-dryrun)
          $jsonLines | ForEach-Object { Write-Host $_ }
          Assert-Plan $jsonLines 'json'

          # Force the portable YAML path used when --format json is unavailable.
          Remove-Item -Force 'secrets/backend.env' -ErrorAction SilentlyContinue
          Remove-Item -Force 'secrets/wallos-ledger.env' -ErrorAction SilentlyContinue
          Remove-Item -Force '.env' -ErrorAction SilentlyContinue
          Write-Host '--- compose YAML fallback path ---'
          $yamlLines = @(& ./deploy/windows/setup/Build-OfflineBundle.ps1 -DryRun -ForceLegacyComposeConfig -Version 0.0.0-dryrun)
          $yamlLines | ForEach-Object { Write-Host $_ }
          Assert-Plan $yamlLines 'yaml'
